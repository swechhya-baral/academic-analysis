{% extends 'academics/base.html' %}
{% block title %}Add Attendance{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card p-4">
            <h4 class="mb-4">Add Attendance</h4>
            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label">Enrollment</label>
                    {{ form.enrollment }}
                </div>
                <div class="mb-3">
                    <label class="form-label">Date</label>
                    {{ form.date }}
                </div>
                <div class="form-check mb-3">
                    {{ form.present }}
                    <label class="form-check-label">Present</label>
                </div>
                <button type="submit" class="btn btn-primary w-100 mt-2">Save Attendance</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
