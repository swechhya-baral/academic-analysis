{% extends 'academics/base.html' %}
{% block title %}Manage Teachers{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center">
    <h2>Manage Teachers</h2>
    <a href="{% url 'teacher_add' %}" class="btn btn-primary">+ Add Teacher</a>
</div>
<table class="table mt-3">
    <thead><tr><th>Name</th><th>Department</th><th>Actions</th></tr></thead>
    <tbody>
        {% for t in objects %}
        <tr>
            <td>{{ t.user.get_full_name }}</td>
            <td>{{ t.department }}</td>
            <td>
                <a href="{% url 'teacher_edit' t.pk %}" class="btn btn-sm btn-outline-primary">Edit</a>
                <a href="{% url 'teacher_delete' t.pk %}" class="btn btn-sm btn-outline-danger">Delete</a>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>
<a href="{% url 'manage_hub' %}" class="btn btn-link">← Back to Manage Hub</a>
{% endblock %}
