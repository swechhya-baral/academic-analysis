{% extends 'academics/base.html' %}
{% block title %}Home{% endblock %}
{% block content %}
    <div class="text-center py-5">
        <h1>Welcome to the Academic Performance Analytics System</h1>
        <div class="row mt-4">
            <div class="col-md-6">
                <div class="card p-4">
                    <h3>{{ student_count }}</h3>
                    <p class="text-muted">Total Students</p>
                </div>
            </div>
            <div class="col-md-6">
                <div class="card p-4">
                    <h3>{{ course_count }}</h3>
                    <p class="text-muted">Total Courses</p>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
